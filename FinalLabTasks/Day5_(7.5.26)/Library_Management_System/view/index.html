<!DOCTYPE html>
<html>
<head>
    <title>Library Management System</title>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

    <style>
        body {
            font-family: Arial;
            background: linear-gradient(to right, #4facfe, #00f2fe);
        }

        .container {
            width: 80%;
            margin: auto;
            background: white;
            padding: 20px;
            margin-top: 40px;
            border-radius: 10px;
        }

        h2 {
            text-align: center;
        }

        form input,
        form select {
            padding: 10px;
            margin: 5px;
        }

        button {
            padding: 10px 15px;
            border: none;
            color: white;
            cursor: pointer;
            margin: 5px;
        }
        
        .addBtn {
        background: green;
        }

        .editBtn {
            background: #f1c40f;
            color: black;
        }

        .deleteBtn {
            background: red;
        }

        .updateBtn {
            background: green;
        }


        table {
            width: 100%;
            margin-top: 20px;
            border-collapse: collapse;
            background: white;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 10px;
            text-align: center;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Library Management System</h2>

    <form id="bookForm">
        <input type="hidden" id="book_id">

        <input type="text" id="title" placeholder="Book Title">
        <input type="text" id="author" placeholder="Author Name">
        <input type="text" id="category" placeholder="Category">

        <select id="status">
            <option value="Available">Available</option>
            <option value="Not Available">Not Available</option>
        </select>

        <button type="button" id="addBtn" class="addBtn">Add Book</button>
        <button type="button" id="updateBtn" class="updateBtn" style="display:none;">Update Book</button>
    </form>

    <hr>

    <table>
        <thead>
            <tr>
                <th>ID</th>
                <th>Title</th>
                <th>Author</th>
                <th>Category</th>
                <th>Status</th>
                <th>Action</th>
            </tr>
        </thead>

        <tbody id="bookData"></tbody>
    </table>

</div>

<script src="script.js"></script>

</body>
</html>
